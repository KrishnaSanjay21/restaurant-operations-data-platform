name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev,dashboard]'
      - run: ruff check .
      - run: pytest --cov=restaurant_ops --cov-report=term-missing

  dbt-compile:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: placeholder
      SNOWFLAKE_USER: placeholder
      SNOWFLAKE_PASSWORD: placeholder
      SNOWFLAKE_ROLE: TRANSFORMER
      SNOWFLAKE_DATABASE: RESTAURANT_OPS
      SNOWFLAKE_WAREHOUSE: RESTAURANT_OPS_WH
      SNOWFLAKE_SCHEMA: ANALYTICS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dbt.txt
      - run: mkdir -p ~/.dbt && cp dbt/restaurant_ops/profiles.yml.example ~/.dbt/profiles.yml
      - run: dbt deps --project-dir dbt/restaurant_ops
      - run: dbt parse --project-dir dbt/restaurant_ops

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform/aws fmt -check -recursive
      - run: terraform -chdir=terraform/aws init -backend=false
      - run: terraform -chdir=terraform/aws validate

